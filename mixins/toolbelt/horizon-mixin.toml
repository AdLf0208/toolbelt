[mod]
id = "toolbelt"
version = "2.2.10"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure belt engine (standalone crate lib, injected as
# `crate::game::toolbelt`): size, insert/extract rules, stack merging, the
# component round-trip.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "toolbelt"
source = "runtime.rs"

# Game-side glue: the item components, the deferred menu, the click
# interactions and the `/toolbelt` command.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "toolbelt_state"
source = "support.rs"

# Before content loads: register the two custom component ids.
[[injection]]
id = "component-types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "types" },
]

# Right click in air with the belt: insert/extract/open.
[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# Right click on a block with the belt: the same, claiming the click.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# End of a running server tick: open queued menus, refresh open ones.
[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "ServerTickPhase", value = "phase" },
]

# A click in the belt menu: take that belt slot.
[[injection]]
id = "menu-clicked"
hook = "menu_clicked"
hook_version = 1
kind = "HEAD"
helper = "menu_clicked.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slot", ty = "i32", value = "slot" },
]

# The belt menu closed: forget its state.
[[injection]]
id = "menu-closed"
hook = "menu_closed"
hook_version = 1
kind = "HEAD"
helper = "menu_closed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
]

# `/toolbelt ...`: the headless-testable fallback for the menu and storage.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
